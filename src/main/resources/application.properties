spring.application.name=intelligent-resume-parser

spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:postgresql://localhost:5432/cerebro_db
spring.datasource.username=cerebro_admin
spring.datasource.password=cerebro_secure_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# LangChain4j AI Integration Endpoints
openai.api.key=a
gemini.api.key=###

# Explicitly disable the open-in-view warning we saw in your initial logs
spring.jpa.open-in-view=false
