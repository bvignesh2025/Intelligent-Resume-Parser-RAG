services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cerebro-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cerebro_admin
      POSTGRES_PASSWORD: cerebro_secure_password
      POSTGRES_DB: cerebro_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "cerebro_admin", "-d", "cerebro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: